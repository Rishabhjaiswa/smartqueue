spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false

spring.data.redis.url=${REDIS_URL:redis://127.0.0.1:6379}

server.port=${PORT:8080}

spring.autoconfigure.exclude=org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration
spring.cloud.function.scan.enabled=false
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.timeout=2s

smartqueue.ai.enabled=${AI_ENABLED:false}

telegram.bot.default-office-id=1

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
smartqueue.reset-on-startup=${SMARTQUEUE_RESET_ON_STARTUP:false}

spring.sql.init.mode=always

clinic.redis.queue-prefix=queue:doctor:
clinic.redis.consultation-key=consultation:doctor:
clinic.redis.load-key=doctor:load:

clinic.priority-recalc-interval-seconds=60
clinic.no-show-timeout-minutes=10
clinic.starvation-boost-after-minutes=30
clinic.max-emergency-per-hour=3
clinic.default-consult-minutes=10
clinic.open-hour=${CLINIC_OPEN_HOUR:0}
clinic.close-hour=${CLINIC_CLOSE_HOUR:23}
clinic.break-start-hour=${CLINIC_BREAK_START_HOUR:13}
clinic.break-end-hour=${CLINIC_BREAK_END_HOUR:14}
smartqueue.enable-auto-rebalance=${ENABLE_AUTO_REBALANCE:true}
telegram.session.ttl-minutes=${TELEGRAM_SESSION_TTL_MINUTES:180}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── Phase 1: Actuator + Prometheus ─────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=smartqueue
management.metrics.tags.environment=${APP_ENV:local}

# ── Phase 1: Resilience4j — Ollama Circuit Breaker ─────────────────────────
# Opens after 50% failure rate over a 10-call sliding window.
# Waits 10 s in OPEN state before allowing 3 trial calls (HALF_OPEN).
# Falls back to RuleBasedPreClassifier on open circuit.
resilience4j.circuitbreaker.instances.ollama.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ollama.sliding-window-size=10
resilience4j.circuitbreaker.instances.ollama.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ollama.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ollama.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ollama.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.ollama.register-health-indicator=true

# ── Phase 1: Micrometer — circuit breaker metric export ────────────────────
resilience4j.circuitbreaker.instances.ollama.record-exceptions=java.lang.Exception

# ── Phase 2: Async executor — AI triage thread pool ────────────────────────
# Tune via env vars in Kubernetes/Docker Compose if default throughput is insufficient.
smartqueue.async.ai.core-pool-size=${AI_EXECUTOR_CORE:4}
smartqueue.async.ai.max-pool-size=${AI_EXECUTOR_MAX:16}
smartqueue.async.ai.queue-capacity=${AI_EXECUTOR_QUEUE:50}

# ── Phase 2: Starvation prevention ─────────────────────────────────────────
# Amount by which long-waiting tokens' priority scores are reduced per boost cycle.
# Lower score = higher priority in the ascending ZSet.
clinic.starvation-score-reduction=${STARVATION_SCORE_REDUCTION:500000}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
