services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: smartqueue-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartqueue_dev
      POSTGRES_USER: ${DB_USERNAME:-smartqueue_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartqueue_dev}
    ports:
      - "5433:5432" # Changed to 5433 to avoid conflict
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartqueue_dev} -d smartqueue_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: smartqueue-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379" # Changed to 6380 to avoid conflict
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
